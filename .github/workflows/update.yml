name: 디데이 배너 매일 갱신

on:
  schedule:
    # 💡 UTC 15:00 = 한국 시간(KST) 밤 12시(자정) 정각
    # 기존 '10 15'에서 '0 15'로 변경하여 자정 정각에 트리거되도록 수정했습니다.
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 💡 Node.js 20 경고를 제거하기 위해 워크플로우 수준에서 Node.js 24 환경을 강제합니다.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy

      - name: 배너 이미지 생성
        run: python generate.py

      - name: 변경사항 저장(커밋)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dday.png
          # 💡 [skip ci]를 추가하여 깃허브 액션이 무한 루프를 돌지 않도록 안전장치를 보강했습니다.
          git commit -m "디데이 배너 자동 갱신 [skip ci]" || echo "변경 없음"
          git push
